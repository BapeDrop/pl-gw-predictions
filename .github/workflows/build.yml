name: Build predictions page

on:
  schedule:
    - cron: "0 10 * * 2,5"   # Tue + Fri 10:00 UTC, an hour before the claude.ai routine publishes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page from the FPL feed
        run: python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gw-predictions.html
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Auto build $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
