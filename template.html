<title>GW Predictions League</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F1F6; --surface:#FFFFFF; --surface-2:#EAE6F0; --line:#D6D0E0; --line-strong:#B9B1C7;
  --ink:#231A2B; --ink-2:#5B5266; --ink-3:#8A8195;
  --accent:#1D7A46; --accent-ink:#FFFFFF; --accent-soft:#DCEFE3;
  --leo:#6B3FA0; --jack:#0E7C86; --max:#C2711B;
  --leo-soft:#EEE6F7; --jack-soft:#DFF1F2; --max-soft:#F9EBDC;
  --gold:#B8860B;
  --shadow:0 1px 2px rgba(35,26,43,.06),0 8px 24px rgba(35,26,43,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15111B; --surface:#1F1926; --surface-2:#2A2333; --line:#3A3245; --line-strong:#4E4560;
    --ink:#F1ECF6; --ink-2:#B8AFC4; --ink-3:#7F7590;
    --accent:#3FBF75; --accent-ink:#0E1A12; --accent-soft:#1E3A2A;
    --leo:#B48CE8; --jack:#5CC9D3; --max:#F0A55A;
    --leo-soft:#2C2140; --jack-soft:#16323A; --max-soft:#3A2A18;
    --gold:#E4B54A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15111B; --surface:#1F1926; --surface-2:#2A2333; --line:#3A3245; --line-strong:#4E4560;
  --ink:#F1ECF6; --ink-2:#B8AFC4; --ink-3:#7F7590;
  --accent:#3FBF75; --accent-ink:#0E1A12; --accent-soft:#1E3A2A;
  --leo:#B48CE8; --jack:#5CC9D3; --max:#F0A55A;
  --leo-soft:#2C2140; --jack-soft:#16323A; --max-soft:#3A2A18;
  --gold:#E4B54A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto}
h1,h2,h3{font-family:"Big Shoulders Display","Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:900;letter-spacing:.01em;text-wrap:balance;margin:0}
.disp{font-family:"Big Shoulders Display","Barlow Condensed",Impact,sans-serif;font-weight:900}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:32px;line-height:1}
.brand .sub{font-size:12px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.crew{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;color:var(--surface)}
.chip.leo{background:var(--leo)}.chip.jack{background:var(--jack)}.chip.max{background:var(--max)}
.chip .n{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.small{padding:5px 10px;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-bottom:3px solid transparent;font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:6px;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .st{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:2px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.tab .st.live{background:var(--accent-soft);color:var(--accent)}
.tab .st.next{background:var(--leo-soft);color:var(--leo)}
.sync{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sync.db{color:var(--accent)}

.gwhead{padding-block:22px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.gwhead h2{font-size:44px;line-height:.95}
.gwhead p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.gwhead .meta{font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;text-align:right}
.progress{display:flex;gap:5px;align-items:center;margin-top:8px;justify-content:flex-end}
.progress .dot{width:20px;height:8px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.progress .dot.part{background:var(--line-strong)}
.progress .dot.done{background:var(--accent);border-color:var(--accent)}

.fixtures{display:flex;flex-direction:column;gap:10px}
.day{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:16px;padding-left:2px}
.day:first-child{margin-top:0}
.match{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.match[open]{box-shadow:var(--shadow);border-color:var(--line-strong)}
.match>summary{list-style:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 16px;cursor:pointer}
.match>summary::-webkit-details-marker{display:none}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.team.a{justify-content:flex-end;text-align:right}
.team.a .stripe{order:2}
.stripe{width:6px;height:28px;border-radius:2px;flex:none}
.tname{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:26px;line-height:1}
.tsub{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.tsub .pos{color:var(--ink-2)}
.mid{text-align:center;min-width:92px}
.mid .ko{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:700;font-size:20px;line-height:1}
.mid .ko.ft{font-size:28px;font-weight:900}
.mid .status{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-top:4px;font-weight:600}
.mid .status.done{color:var(--accent)}
.mid .status.ft{color:var(--ink-2)}
.body{border-top:1px solid var(--line);padding:16px}
.section{margin-top:18px}
.section:first-child{margin-top:0}
.section h3{font-size:22px;line-height:1;display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.section h3 .hint{font-family:"Barlow",sans-serif;font-size:13px;font-weight:500;color:var(--ink-3)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formcard{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.formcard b{color:var(--ink);font-weight:700}
.formline{display:flex;gap:3px;margin-top:6px}
.formline span{width:18px;height:18px;border-radius:3px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.formline .W{background:#2E9E5B}.formline .D{background:#9A93A6}.formline .L{background:#C94C4C}
.hot{margin-top:8px;font-size:12px;color:var(--ink-3)}
.hot b{color:var(--ink-2);font-weight:600}

.pred{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--surface)}
.pred.leo{border-left:5px solid var(--leo)}.pred.jack{border-left:5px solid var(--jack)}.pred.max{border-left:5px solid var(--max)}
.who{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:22px;width:56px;line-height:1}
.leo .who{color:var(--leo)}.jack .who{color:var(--jack)}.max .who{color:var(--max)}
.score{display:flex;align-items:center;gap:8px;justify-content:center}
.score .abbr{font-size:12px;font-weight:700;color:var(--ink-3);width:34px;text-align:center;letter-spacing:.06em}
.score input{width:54px;height:46px;text-align:center;font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:30px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink);-moz-appearance:textfield}
.score input:disabled{background:transparent;border-color:var(--line);color:var(--ink)}
.score input::-webkit-outer-spin-button,.score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.score .dash{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:26px;color:var(--ink-3)}
.call{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);min-width:96px;text-align:right}
.call.set{color:var(--ink-2)}
.call .pt{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);font-size:11px}
.call .pt.hit{background:var(--accent-soft);color:var(--accent)}
.call .pt.exact{background:var(--accent);color:var(--accent-ink)}

.pick{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.pick.leo{border-left:5px solid var(--leo)}.pick.jack{border-left:5px solid var(--jack)}.pick.max{border-left:5px solid var(--max)}
.pick-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pick-row .who{width:56px}
.pick select{flex:1;min-width:200px;height:40px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink);padding:0 10px;font:inherit;font-size:14px}
.pick select:disabled{opacity:.6}
.pick .locknote{font-size:12px;color:var(--ink-3);flex:1}
.pcard{display:none;margin-top:10px;background:var(--surface-2);border-radius:8px;padding:12px 14px;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.pcard.on{display:grid;animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.pcard .pname{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:26px;line-height:1}
.pcard .pmeta{font-size:12px;color:var(--ink-2);font-weight:600;letter-spacing:.04em;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:64px;text-align:center}
.stat .v{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:24px;line-height:1}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin-top:2px}
.stat.price .v{color:var(--accent)}
.stat.gw{background:var(--accent);border-color:var(--accent)}
.stat.gw .v,.stat.gw .k{color:var(--accent-ink)}
.pcard .extra{grid-column:1/-1;font-size:12px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap}
.pcard .extra b{color:var(--ink-2);font-weight:600}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:12px;border-top:1px dashed var(--line)}
.nav .count{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.08em}

.review{margin-top:36px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 16px;box-shadow:var(--shadow)}
.review-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.review h2{font-size:40px;line-height:.95}
.review .sum{color:var(--ink-2);font-size:14px;margin-top:4px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line-strong);font-weight:700}
th.leo{color:var(--leo)}th.jack{color:var(--jack)}th.max{color:var(--max)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.fx{font-weight:700;white-space:nowrap}
td.fx small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.rs{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:22px;line-height:1;display:flex;align-items:baseline;gap:6px}
.rs .pt{font-family:"Barlow",sans-serif;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.rs .pt.hit{background:var(--accent-soft);color:var(--accent)}
.rs .pt.exact{background:var(--accent);color:var(--accent-ink)}
.rp{font-size:12px;color:var(--ink-2);margin-top:2px;white-space:nowrap}
.rp .m{color:var(--ink-3)}
.rp .gp{font-weight:700;color:var(--accent)}
td .none{color:var(--ink-3);font-style:italic;font-size:13px}
tr.agree td{background:var(--accent-soft)}
tfoot td{font-weight:700;border-top:2px solid var(--line-strong);border-bottom:0}
tfoot .big{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:26px;font-weight:900;line-height:1}
tfoot .sub{font-size:12px;color:var(--ink-3);font-weight:500}
.legend{font-size:12px;color:var(--ink-3);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;background:var(--accent-soft);border:1px solid var(--accent);vertical-align:-2px;margin-right:4px;border-radius:2px}

.season{margin-top:28px}
.season h2{font-size:40px;line-height:.95}
.season .rules{color:var(--ink-2);font-size:14px;margin:6px 0 14px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.pod{border-radius:10px;padding:14px;position:relative;display:flex;flex-direction:column;gap:6px}
.pod.leo{background:var(--leo-soft)}.pod.jack{background:var(--jack-soft)}.pod.max{background:var(--max-soft)}
.pod .rank{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pod .rank.first{color:var(--gold)}
.pod .n{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:26px;line-height:1}
.pod.leo .n{color:var(--leo)}.pod.jack .n{color:var(--jack)}.pod.max .n{color:var(--max)}
.pod .total{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.pod .d{font-size:13px;color:var(--ink-2);line-height:1.5}
.pod .d b{color:var(--ink);font-weight:700}
.wk{font-size:14px}
.wk td.win{font-weight:700;color:var(--ink)}
.wk .crown{color:var(--gold);margin-left:4px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{margin-top:18px;font-size:12px;color:var(--ink-3)}

@media (max-width:560px){
  .brand h1{font-size:28px}
  .gwhead h2{font-size:36px}
  .gwhead .meta{text-align:left}
  .progress{justify-content:flex-start}
  .tname{font-size:20px}
  .match>summary{padding:12px}
  .mid{min-width:72px}
  .pred{grid-template-columns:auto 1fr;gap:8px}
  .call{grid-column:1/-1;text-align:left;min-width:0}
  .formgrid{grid-template-columns:1fr}
  .podium{grid-template-columns:1fr}
  .who{width:48px;font-size:19px}
  .score input{width:48px;height:42px;font-size:26px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand"><h1>Predictions League</h1><span class="sub">Premier League · 2026/27</span></div>
      <div class="crew" id="crew"></div>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>

  <section class="gwhead">
    <div>
      <h2 id="gwTitle"></h2>
      <p id="gwBlurb"></p>
    </div>
    <div>
      <div class="meta" id="gwMeta"></div>
      <div class="progress" id="progress"></div>
    </div>
  </section>

  <div id="gwPanels"></div>

  <section class="review" id="review">
    <div class="review-head">
      <div>
        <h2 id="reviewTitle">The board</h2>
        <div class="sum" id="reviewSum"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn small" id="copyBtn">Copy summary</button>
      </div>
    </div>
    <div class="tablewrap"><table id="reviewTable"></table></div>
    <div class="legend"><i></i>All three agree on the result</div>
  </section>

  <section class="season" id="season">
    <h2>Season standings</h2>
    <div class="rules">Exact score 3 points. Correct result 1 point. Player pick earns that player's Fantasy points for the gameweek.</div>
    <div class="podium" id="podium"></div>
    <div class="tablewrap"><table class="wk" id="weekTable"></table></div>
    <div class="foot" id="foot"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var TEAMS = D.teams, GWS = D.gameweeks, PL = D.players;
  var PEOPLE = ['leo','jack','max'];
  var NAMES = {leo:'Leo',jack:'Jack',max:'Max'};
  var COLORS = {ARS:'#EF0107',AVL:'#670E36',BOU:'#DA291C',BRE:'#E30613',BHA:'#0057B8',CHE:'#034694',COV:'#5FB8E8',CRY:'#1B458F',EVE:'#003399',FUL:'#555555',HUL:'#F5A12D',IPS:'#0044A9',LEE:'#F2C300',LIV:'#C8102E',MCI:'#6CABDD',MUN:'#DA291C',NEW:'#241F20',NFO:'#DD0000',TOT:'#132257',SUN:'#EB172B'};
  var KEY = 'pl-predictions-league-2026';
  var byId = {}; PL.forEach(function(p){ byId[p.id]=p; });
  var gwById = {}; GWS.forEach(function(g){ gwById[g.id]=g; });
  var NOW = Date.now();

  // ---------- state: {gw4:{pred:{fid:{leo:{h,a}}}, picks:{fid:{leo:{snapshot}}}}}
  var state = {};
  try{ state = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ state = {}; }
  // migrate the first single-gameweek board if it was used
  try{
    var old = JSON.parse(localStorage.getItem('gw4-predictions-2026'));
    if(old && old.matches && !state.gw4){
      var mig = {pred:{},picks:{}};
      Object.keys(old.matches).forEach(function(fid){
        var x=old.matches[fid]; if(x.pred) mig.pred[fid]=x.pred;
        PEOPLE.forEach(function(p){ var pid=x.picks&&x.picks[p]; if(pid&&byId[pid]){ mig.picks[fid]=mig.picks[fid]||{}; mig.picks[fid][p]=snap(byId[pid]); } });
      });
      state.gw4 = mig; saveLocal();
    }
  }catch(e){}
  function gs(g){ var k='gw'+g; if(!state[k]) state[k]={pred:{},picks:{}}; state[k].pred=state[k].pred||{}; state[k].picks=state[k].picks||{}; return state[k]; }
  function snap(p){ return {id:p.id,n:p.n,full:p.full,pos:p.pos,t:p.t,price:p.price,pts:p.pts,form:p.form,g:p.g,a:p.a,cs:p.cs,min:p.min,sel:p.sel}; }
  function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  var db = null, dbTimers = {};
  function persist(g){
    saveLocal();
    if(!db) return;
    clearTimeout(dbTimers[g]);
    dbTimers[g] = setTimeout(function(){
      db.doc('gameweeks/gw'+g).set(JSON.parse(JSON.stringify(gs(g)))).catch(function(e){ setSync('saved on this device only'); });
    }, 400);
  }
  function setSync(t, ok){ var el=document.getElementById('sync'); if(el){ el.textContent=t; el.className='sync'+(ok?' db':''); } }

  // ---------- helpers
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function ordinal(n){ var s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
  function fmtKO(iso, style){
    var d=new Date(iso);
    if(style==='day') return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'America/New_York'});
    if(style==='short') return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/New_York'});
    if(style==='uk') return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'});
    return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}).replace(':00','');
  }
  function teamPlayers(tid){ return PL.filter(function(p){return p.t===tid;}).sort(function(a,b){return b.pts-a.pts||b.price-a.price;}); }
  function posName(p){ return {GKP:'Goalkeeper',DEF:'Defender',MID:'Midfielder',FWD:'Forward'}[p]||p; }
  function call(pr){ if(!pr||pr.h==null||pr.a==null||pr.h===''||pr.a==='') return null; var x=+pr.h,y=+pr.a; return x>y?'H':x<y?'A':'D'; }
  function callText(c,h,a){ return c==='H'?h.short+' win':c==='A'?a.short+' win':c==='D'?'Draw':'—'; }
  function locked(f){ return f.fin || f.started || NOW > new Date(f.ko).getTime(); }
  function predPts(pr, f){ if(!f.fin) return null; var c=call(pr); if(!c) return 0; if(+pr.h===f.hs && +pr.a===f.as) return 3; var actual=f.hs>f.as?'H':f.hs<f.as?'A':'D'; return c===actual?1:0; }
  function pickPts(g, pk){ if(!pk) return null; var gw=gwById[g]; var v=gw.live[String(pk.id)]; return v==null?(gw.finished?0:null):v; }
  function fixtureDone(g,f){ var x=gs(g); return PEOPLE.every(function(p){ return call(x.pred[f.id]&&x.pred[f.id][p])!==null && x.picks[f.id]&&x.picks[f.id][p]; }); }
  function fixturePart(g,f){ var x=gs(g); return PEOPLE.some(function(p){ return call(x.pred[f.id]&&x.pred[f.id][p])!==null || (x.picks[f.id]&&x.picks[f.id][p]); }); }
  function gwStatus(g){ var gw=gwById[g]; if(gw.finished) return 'final'; if(gw.fixtures.some(function(f){return f.started;})) return 'live'; return 'next'; }
  function totals(g, who){
    var x=gs(g), gw=gwById[g], t={pred:0,pick:0,exact:0,hit:0,n:0,picks:0};
    gw.fixtures.forEach(function(f){
      var pr=x.pred[f.id]&&x.pred[f.id][who]; var pk=x.picks[f.id]&&x.picks[f.id][who];
      if(call(pr)!==null) t.n++; if(pk) t.picks++;
      var pp=predPts(pr,f); if(pp!=null){ t.pred+=pp; if(pp===3)t.exact++; if(pp>=1)t.hit++; }
      var kp=pickPts(g,pk); if(kp!=null) t.pick+=kp;
    });
    t.total=t.pred+t.pick; return t;
  }

  // ---------- tabs and crew
  var active = GWS[GWS.length-1].id;
  try{ var sv=+localStorage.getItem(KEY+'-tab'); if(gwById[sv]) active=sv; }catch(e){}
  function renderTabs(){
    document.getElementById('tabs').innerHTML = GWS.map(function(g){
      var st=gwStatus(g.id);
      return '<button class="tab'+(g.id===active?' on':'')+'" data-gw="'+g.id+'">GW'+g.id+' <span class="st '+(st==='live'?'live':st==='next'?'next':'')+'">'+(st==='final'?'Final':st==='live'?'Live':'Upcoming')+'</span></button>';
    }).join('') + '<span class="sync" id="sync" style="margin-left:auto;align-self:center;padding:0 6px"></span>';
  }
  document.getElementById('tabs').addEventListener('click', function(e){ var b=e.target.closest('[data-gw]'); if(!b) return; setActive(+b.dataset.gw); });
  function setActive(g){ active=g; try{ localStorage.setItem(KEY+'-tab', g); }catch(e){} renderTabs(); renderAll(); window.scrollTo({top:0}); }
  function renderCrew(){
    var sums={}; PEOPLE.forEach(function(p){ sums[p]=0; GWS.forEach(function(g){ sums[p]+=totals(g.id,p).total; }); });
    document.getElementById('crew').innerHTML = PEOPLE.map(function(p){ return '<span class="chip '+p+'">'+NAMES[p]+' <span class="n">'+sums[p]+'</span></span>'; }).join('');
  }

  // ---------- build gameweek panels once
  var panels = document.getElementById('gwPanels');
  GWS.forEach(function(gw){
    var wrapEl=document.createElement('div'); wrapEl.className='fixtures'; wrapEl.dataset.panel=gw.id; wrapEl.hidden=true;
    var lastDay='';
    gw.fixtures.forEach(function(f,i){
      var h=TEAMS[f.h], a=TEAMS[f.a];
      var day=fmtKO(f.ko,'day');
      if(day!==lastDay){ var dl=document.createElement('div'); dl.className='day'; dl.textContent=day; wrapEl.appendChild(dl); lastDay=day; }
      var det=document.createElement('details'); det.className='match'; det.id='m'+gw.id+'-'+f.id; det.dataset.fid=f.id; det.dataset.gw=gw.id;
      var hp=teamPlayers(f.h), ap=teamPlayers(f.a), lk=locked(f);
      function hotList(list){ return list.slice(0,3).map(function(p){return '<b>'+esc(p.n)+'</b> '+p.pts+' pts';}).join(' · '); }
      function formHtml(t){ return '<div class="formline">'+t.form.split('').map(function(c){return '<span class="'+c+'">'+c+'</span>';}).join('')+'</div>'; }
      function opts(list,label){ return '<optgroup label="'+esc(label)+'">'+list.map(function(p){ return '<option value="'+p.id+'">'+esc(p.n)+' · '+p.pos+' · £'+p.price.toFixed(1)+'m · '+p.pts+' pts</option>'; }).join('')+'</optgroup>'; }
      var midHtml = f.fin ? '<div class="ko ft num">'+f.hs+'–'+f.as+'</div><div class="status ft">Full time</div>'
                  : f.started ? '<div class="ko ft num">'+(f.hs==null?'':f.hs+'–'+f.as)+'</div><div class="status" data-status>Live</div>'
                  : '<div class="ko num">'+fmtKO(f.ko)+'</div><div class="status" data-status></div>';
      det.innerHTML =
        '<summary>'+
          '<div class="team h"><span class="stripe" style="background:'+COLORS[h.short]+'"></span><div><div class="tname">'+esc(h.name)+'</div><div class="tsub"><span class="pos">'+ordinal(h.rank)+'</span> · '+h.pts+' pts · '+h.form+'</div></div></div>'+
          '<div class="mid">'+midHtml+'</div>'+
          '<div class="team a"><span class="stripe" style="background:'+COLORS[a.short]+'"></span><div><div class="tname">'+esc(a.name)+'</div><div class="tsub"><span class="pos">'+ordinal(a.rank)+'</span> · '+a.pts+' pts · '+a.form+'</div></div></div>'+
        '</summary>'+
        '<div class="body">'+
          '<div class="section"><h3>Form <span class="hint">kickoff '+fmtKO(f.ko)+' ET ('+fmtKO(f.ko,'uk')+' UK)'+(lk?' · predictions locked':'')+'</span></h3>'+
            '<div class="formgrid">'+
              '<div class="formcard"><b>'+esc(h.name)+'</b> · '+ordinal(h.rank)+' · W'+h.w+' D'+h.d+' L'+h.l+' · GF '+h.gf+' GA '+h.ga+formHtml(h)+'<div class="hot">Top scorers: '+hotList(hp)+'</div></div>'+
              '<div class="formcard"><b>'+esc(a.name)+'</b> · '+ordinal(a.rank)+' · W'+a.w+' D'+a.d+' L'+a.l+' · GF '+a.gf+' GA '+a.ga+formHtml(a)+'<div class="hot">Top scorers: '+hotList(ap)+'</div></div>'+
            '</div></div>'+
          '<div class="section"><h3>Predictions <span class="hint">'+(f.fin?'final score '+f.hs+'–'+f.as:'final score')+'</span></h3>'+
            PEOPLE.map(function(p){ return '<div class="pred '+p+'"><div class="who">'+NAMES[p]+'</div>'+
              '<div class="score"><span class="abbr">'+h.short+'</span><input id="p-'+gw.id+'-'+f.id+'-'+p+'-h" type="number" inputmode="numeric" min="0" max="15" data-pred="h" data-who="'+p+'"'+(lk?' disabled':'')+' aria-label="'+NAMES[p]+' '+esc(h.name)+' goals"><span class="dash">–</span><input id="p-'+gw.id+'-'+f.id+'-'+p+'-a" type="number" inputmode="numeric" min="0" max="15" data-pred="a" data-who="'+p+'"'+(lk?' disabled':'')+' aria-label="'+NAMES[p]+' '+esc(a.name)+' goals"><span class="abbr">'+a.short+'</span></div>'+
              '<div class="call" data-call="'+p+'">—</div></div>'; }).join('')+
          '</div>'+
          '<div class="section"><h3>Player to watch <span class="hint">one from either side</span></h3>'+
            PEOPLE.map(function(p){ return '<div class="pick '+p+'"><div class="pick-row"><div class="who">'+NAMES[p]+'</div>'+
              (lk ? '<span class="locknote" data-locknote="'+p+'">Locked at kickoff</span>'
                  : '<select id="k-'+gw.id+'-'+f.id+'-'+p+'" data-pick="'+p+'" aria-label="'+NAMES[p]+' player pick"><option value="">Choose a player…</option>'+opts(hp,h.name)+opts(ap,a.name)+'</select>')+
              '</div><div class="pcard" data-card="'+p+'"></div></div>'; }).join('')+
          '</div>'+
          '<div class="nav"><button class="btn small ghost" data-nav="prev"'+(i===0?' disabled':'')+'>← Previous</button><span class="count">Match '+(i+1)+' of '+gw.fixtures.length+'</span><button class="btn small primary" data-nav="next">'+(i===gw.fixtures.length-1?'Go to the board →':'Next match →')+'</button></div>'+
        '</div>';
      wrapEl.appendChild(det);
    });
    panels.appendChild(wrapEl);
  });

  // ---------- render helpers (in place, keeps focus)
  function q(g,f,sel){ return document.querySelector('#m'+g+'-'+f+' '+sel); }
  function renderCard(g,f,who){
    var el=q(g,f.id,'[data-card="'+who+'"]'); var x=gs(g); var pk=x.picks[f.id]&&x.picks[f.id][who];
    if(!pk){ el.className='pcard'; el.innerHTML=''; return; }
    var t=TEAMS[pk.t]; var gp=pickPts(g,pk);
    el.innerHTML='<div><div class="pname">'+esc(pk.full)+'</div><div class="pmeta">'+esc(t.name).toUpperCase()+' · '+posName(pk.pos).toUpperCase()+'</div></div>'+
      '<div class="stats"><div class="stat price"><div class="v">£'+(+pk.price).toFixed(1)+'m</div><div class="k">Price</div></div><div class="stat"><div class="v num">'+pk.pts+'</div><div class="k">Season pts</div></div><div class="stat"><div class="v num">'+pk.form+'</div><div class="k">Form</div></div>'+
      (gp!=null?'<div class="stat gw"><div class="v num">'+gp+'</div><div class="k">GW'+g+' pts</div></div>':'')+'</div>'+
      '<div class="extra"><span><b>'+pk.g+'</b> goals</span><span><b>'+pk.a+'</b> assists</span><span><b>'+pk.cs+'</b> clean sheets</span><span><b>'+pk.min+'</b> mins</span><span>owned by <b>'+pk.sel+'%</b></span></div>';
    if(el.className!=='pcard on') el.className='pcard on';
    var ln=q(g,f.id,'[data-locknote="'+who+'"]'); if(ln) ln.textContent='';
  }
  function renderCall(g,f,who){
    var h=TEAMS[f.h],a=TEAMS[f.a]; var el=q(g,f.id,'[data-call="'+who+'"]');
    var pr=gs(g).pred[f.id]&&gs(g).pred[f.id][who]; var c=call(pr); var pp=predPts(pr,f);
    el.innerHTML=esc(callText(c,h,a))+(pp!=null&&c?'<span class="pt'+(pp===3?' exact':pp===1?' hit':'')+'">'+(pp===3?'exact +3':pp===1?'result +1':'0')+'</span>':'');
    el.className='call'+(c?' set':'');
  }
  function renderStatus(g,f){
    var el=q(g,f.id,'[data-status]'); if(!el||f.started) return;
    var done=fixtureDone(g,f), part=fixturePart(g,f);
    el.textContent=done?'Locked in':part?'In progress':'Open'; el.className='status'+(done?' done':'');
  }
  function renderInputs(g,f){
    var x=gs(g);
    PEOPLE.forEach(function(p){
      var pr=x.pred[f.id]&&x.pred[f.id][p]||{};
      ['h','a'].forEach(function(side){ var el=document.getElementById('p-'+g+'-'+f.id+'-'+p+'-'+side); if(!el) return; var v=pr[side]==null?'':String(pr[side]); if(document.activeElement!==el && el.value!==v) el.value=v; });
      var sel=document.getElementById('k-'+g+'-'+f.id+'-'+p); if(sel){ var pk=x.picks[f.id]&&x.picks[f.id][p]; var v=pk?String(pk.id):''; if(sel.value!==v) sel.value=v; }
      renderCard(g,f,p); renderCall(g,f,p);
    });
    renderStatus(g,f);
  }
  function renderGW(g){
    var gw=gwById[g];
    [].slice.call(panels.children).forEach(function(el){ el.hidden = +el.dataset.panel!==g; });
    gw.fixtures.forEach(function(f){ renderInputs(g,f); });
    var st=gwStatus(g), done=gw.fixtures.filter(function(f){return fixtureDone(g,f);}).length;
    document.getElementById('gwTitle').textContent = st==='final' ? 'Gameweek '+g+' is in the books.' : st==='live' ? 'Gameweek '+g+' is under way.' : 'Gameweek '+g+'. Ten matches. Call them.';
    document.getElementById('gwBlurb').textContent = st==='next' ? 'Open a match, put a scoreline down for each person, then pick one player from either side. Predictions lock at each kickoff.' : st==='live' ? 'Scores update when the page is refreshed by Claude. Matches that have kicked off are locked.' : 'Every scoreline has been marked and every pick has its Fantasy points for the week.';
    var dl=new Date(gw.deadline);
    document.getElementById('gwMeta').innerHTML = 'FPL deadline '+dl.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/New_York'})+' · '+fmtKO(gw.deadline)+' ET<br>Data as of '+esc(D.built);
    document.getElementById('progress').innerHTML = gw.fixtures.map(function(f){ var d=fixtureDone(g,f); return '<span class="dot'+(d?' done':fixturePart(g,f)?' part':'')+'" title="'+esc(TEAMS[f.h].short+' v '+TEAMS[f.a].short)+'"></span>'; }).join('')+'<span class="sync" style="margin-left:6px">'+done+'/'+gw.fixtures.length+'</span>';
    // open the first unfinished fixture if nothing is open
    var open=panels.querySelector('[data-panel="'+g+'"] details[open]');
    if(!open && st==='next'){ var first=gw.fixtures.filter(function(f){return !fixtureDone(g,f);})[0]||gw.fixtures[0]; document.getElementById('m'+g+'-'+first.id).open=true; }
  }

  // ---------- review board for the active gameweek
  function renderReview(){
    var g=active, gw=gwById[g], x=gs(g);
    var st=gwStatus(g);
    var rows=gw.fixtures.map(function(f){
      var h=TEAMS[f.h],a=TEAMS[f.a];
      var calls=PEOPLE.map(function(p){return call(x.pred[f.id]&&x.pred[f.id][p]);});
      var agree=calls[0]&&calls.every(function(c){return c===calls[0];});
      return '<tr'+(agree?' class="agree"':'')+'><td class="fx">'+esc(h.short)+' v '+esc(a.short)+(f.fin?' <span class="num">'+f.hs+'–'+f.as+'</span>':'')+'<small>'+fmtKO(f.ko,'short')+' '+fmtKO(f.ko)+'</small></td>'+
        PEOPLE.map(function(p){
          var pr=x.pred[f.id]&&x.pred[f.id][p]; var c=call(pr); var pk=x.picks[f.id]&&x.picks[f.id][p]; var pp=predPts(pr,f); var kp=pickPts(g,pk);
          return '<td>'+(c?'<div class="rs num">'+pr.h+'–'+pr.a+(pp!=null?'<span class="pt'+(pp===3?' exact':pp===1?' hit':'')+'">'+(pp===3?'+3':pp===1?'+1':'0')+'</span>':'')+'</div>':'<div class="none">no score</div>')+
            (pk?'<div class="rp">'+esc(pk.n)+' <span class="m">£'+(+pk.price).toFixed(1)+'m</span>'+(kp!=null?' <span class="gp">+'+kp+'</span>':' <span class="m">'+pk.pts+' pts</span>')+'</div>':'<div class="none">no pick</div>')+'</td>';
        }).join('')+'</tr>';
    }).join('');
    var foot = st==='next' ? '' : '<tfoot><tr><td>GW'+g+' total</td>'+PEOPLE.map(function(p){ var t=totals(g,p); return '<td><div class="big num">'+t.total+'</div><div class="sub">'+t.pred+' from scores ('+t.exact+' exact) · '+t.pick+' from picks</div></td>'; }).join('')+'</tr></tfoot>';
    document.getElementById('reviewTable').innerHTML='<thead><tr><th>Match</th><th class="leo">Leo</th><th class="jack">Jack</th><th class="max">Max</th></tr></thead><tbody>'+rows+'</tbody>'+foot;
    document.getElementById('reviewTitle').textContent='GW'+g+' board';
    var done=gw.fixtures.filter(function(f){return fixtureDone(g,f);}).length;
    document.getElementById('reviewSum').textContent = st==='final' ? 'Marked against the final scores.' : done===gw.fixtures.length ? 'All '+gw.fixtures.length+' matches called. Come back after the games to see who got it right.' : done+' of '+gw.fixtures.length+' matches fully called so far.';
  }

  // ---------- season standings
  function renderSeason(){
    var sums={}; PEOPLE.forEach(function(p){ sums[p]={total:0,pred:0,pick:0,exact:0,hit:0,wins:0}; });
    var weekRows=[];
    GWS.forEach(function(g){
      if(gwStatus(g.id)==='next') return;
      var row={}; var best=-1;
      PEOPLE.forEach(function(p){ var t=totals(g.id,p); row[p]=t; sums[p].total+=t.total; sums[p].pred+=t.pred; sums[p].pick+=t.pick; sums[p].exact+=t.exact; sums[p].hit+=t.hit; if(t.total>best) best=t.total; });
      var winners=PEOPLE.filter(function(p){return row[p].total===best && g.finished;});
      if(winners.length===1) sums[winners[0]].wins++;
      weekRows.push({g:g, row:row, best:best, winners:winners});
    });
    var order=PEOPLE.slice().sort(function(a,b){ return sums[b].total-sums[a].total || sums[b].exact-sums[a].exact; });
    var played=weekRows.length;
    document.getElementById('podium').innerHTML = order.map(function(p,i){ var s=sums[p]; return '<div class="pod '+p+'"><div class="rank'+(i===0&&played?' first':'')+'">'+(played?ordinal(i+1):'—')+'</div><div class="n">'+NAMES[p]+'</div><div class="total num">'+s.total+'</div><div class="d"><b>'+s.pred+'</b> from scores · <b>'+s.exact+'</b> exact · <b>'+s.hit+'</b> right results<br><b>'+s.pick+'</b> from player picks · <b>'+s.wins+'</b> weekly win'+(s.wins===1?'':'s')+'</div></div>'; }).join('');
    document.getElementById('weekTable').innerHTML = played ? '<thead><tr><th>Week</th><th class="leo">Leo</th><th class="jack">Jack</th><th class="max">Max</th></tr></thead><tbody>'+weekRows.map(function(w){ return '<tr><td class="fx">GW'+w.g.id+'<small>'+(w.g.finished?'final':'in progress')+'</small></td>'+PEOPLE.map(function(p){ var t=w.row[p]; var win=w.winners.length===1&&w.winners[0]===p; return '<td class="'+(win?'win':'')+'"><span class="num disp" style="font-size:22px">'+t.total+'</span>'+(win?'<span class="crown">★</span>':'')+'<br><span style="font-size:12px;color:var(--ink-3)">'+t.pred+' + '+t.pick+'</span></td>'; }).join('')+'</tr>'; }).join('')+'</tbody>' : '<tbody><tr><td class="none" style="padding:14px 8px">No gameweeks marked yet. Standings appear once GW'+GWS[0].id+' kicks off.</td></tr></tbody>';
    document.getElementById('foot').textContent='Fixtures, prices and points from the official Fantasy Premier League feed, built '+D.built+'. Kickoffs in Eastern Time. Refreshed weekly by Claude.';
  }

  function renderAll(){ renderGW(active); renderReview(); renderSeason(); renderCrew(); }

  // ---------- events
  panels.addEventListener('input', function(e){
    var t=e.target; var det=t.closest('.match'); if(!det||!t.dataset.pred) return;
    var g=+det.dataset.gw, fid=det.dataset.fid, who=t.dataset.who; var x=gs(g);
    x.pred[fid]=x.pred[fid]||{}; x.pred[fid][who]=x.pred[fid][who]||{};
    var v=t.value===''?'':Math.max(0,Math.min(15,parseInt(t.value,10)||0)); x.pred[fid][who][t.dataset.pred]=v;
    persist(g); var f=gwById[g].fixtures.filter(function(q){return String(q.id)===fid;})[0]; renderCall(g,f,who); renderStatus(g,f); renderReview(); renderGWProgress(g);
  });
  panels.addEventListener('change', function(e){
    var t=e.target; var det=t.closest('.match'); if(!det||!t.dataset.pick) return;
    var g=+det.dataset.gw, fid=det.dataset.fid, who=t.dataset.pick; var x=gs(g);
    x.picks[fid]=x.picks[fid]||{}; x.picks[fid][who]=t.value&&byId[+t.value]?snap(byId[+t.value]):null;
    persist(g); var f=gwById[g].fixtures.filter(function(q){return String(q.id)===fid;})[0]; renderCard(g,f,who); renderStatus(g,f); renderReview(); renderGWProgress(g);
  });
  function renderGWProgress(g){ var gw=gwById[g]; var done=gw.fixtures.filter(function(f){return fixtureDone(g,f);}).length; document.getElementById('progress').innerHTML = gw.fixtures.map(function(f){ var d=fixtureDone(g,f); return '<span class="dot'+(d?' done':fixturePart(g,f)?' part':'')+'"></span>'; }).join('')+'<span class="sync" style="margin-left:6px">'+done+'/'+gw.fixtures.length+'</span>'; }
  panels.addEventListener('click', function(e){
    var b=e.target.closest('[data-nav]'); if(!b) return;
    var det=b.closest('.match'); var panel=det.parentNode; var all=[].slice.call(panel.querySelectorAll('.match')); var i=all.indexOf(det);
    if(b.dataset.nav==='next'){ if(i===all.length-1){ det.open=false; document.getElementById('review').scrollIntoView({behavior:'smooth',block:'start'}); return; } det.open=false; var n=all[i+1]; n.open=true; scrollTo(n); }
    else { det.open=false; var pv=all[i-1]; if(pv){ pv.open=true; scrollTo(pv); } }
  });
  function scrollTo(el){ var y=el.getBoundingClientRect().top+window.scrollY-110; window.scrollTo({top:y,behavior:'smooth'}); }

  document.getElementById('copyBtn').addEventListener('click', function(){
    var g=active, gw=gwById[g], x=gs(g), lines=['GW'+g+' predictions'];
    gw.fixtures.forEach(function(f){ var h=TEAMS[f.h],a=TEAMS[f.a];
      lines.push(''); lines.push(h.name+' v '+a.name+(f.fin?' ('+f.hs+'-'+f.as+')':''));
      PEOPLE.forEach(function(p){ var pr=x.pred[f.id]&&x.pred[f.id][p]; var c=call(pr); var pk=x.picks[f.id]&&x.picks[f.id][p]; var pp=predPts(pr,f); var kp=pickPts(g,pk);
        lines.push('  '+NAMES[p]+': '+(c?pr.h+'-'+pr.a+(pp!=null?' ['+pp+']':''):'no score')+(pk?' · '+pk.n+' (£'+(+pk.price).toFixed(1)+'m'+(kp!=null?', '+kp+' GW pts':'')+')':'')); });
    });
    if(gwStatus(g)!=='next'){ lines.push(''); lines.push('Totals: '+PEOPLE.map(function(p){return NAMES[p]+' '+totals(g,p).total;}).join(' · ')); }
    var txt=lines.join('\n');
    function done(ok){ toast(ok?'Summary copied':'Could not copy. Select the table and copy by hand.'); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)}); } else done(false);
  });
  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.className='toast on'; setTimeout(function(){t.className='toast';},1800); }

  // ---------- first paint, then light up shared storage
  renderTabs(); renderAll(); setSync('saved on this device');

  if(window.claude && window.claude.use){
    window.claude.use('db').then(function(ns){
      if(!ns) return;
      db = ns;
      var seeded=false;
      db.collection('gameweeks').onSnapshot(function(snapQ){
        var seen={};
        snapQ.docs.forEach(function(d){ if(d.exists){ seen[d.id]=true; state[d.id]=JSON.parse(JSON.stringify(d.data())); } });
        if(!seeded){
          seeded=true;
          // first sync: push anything entered on this device before the shared store answered
          Object.keys(state).forEach(function(k){ if(!seen[k] && /^gw\d+$/.test(k)){ var s=state[k]; if(s&&(Object.keys(s.pred||{}).length||Object.keys(s.picks||{}).length)) db.doc('gameweeks/'+k).set(JSON.parse(JSON.stringify(s))).catch(function(){}); } });
        }
        saveLocal(); renderAll(); setSync('shared · synced', true);
      }, function(err){ setSync('saved on this device only'); });
    }).catch(function(){});
  }
})();
</script>
